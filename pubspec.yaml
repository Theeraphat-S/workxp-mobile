name: workxp
description: "WorkXP (Pocket Quest) - 16-bit Retro Pixel RPG Productivity App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State Management & Value Equality
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  flutter_riverpod: ^2.6.1

  # Relational Persistence (SQLite ORM)
  drift: ^2.23.1
  drift_flutter: ^0.2.5

  # Key-Value Cache & Local Preferences
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Declarative Type-Safe Routing
  auto_route: ^10.1.0+1

  # Service Locator & Dependency Injection
  get_it: ^8.0.3

  # Networking & Environment Configuration
  dio: ^5.8.0+1
  flutter_dotenv: ^6.0.0

  # UI Enhancement & Feedback
  skeletonizer: ^2.0.1
  toastification: ^3.0.3
  fl_chart: ^1.2.0
  google_fonts: ^8.2.1
  cupertino_icons: ^1.0.8

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.15
  auto_route_generator: ^10.1.0
  drift_dev: ^2.23.1

  # Testing Utilities
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - .env
